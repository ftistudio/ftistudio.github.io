<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Untitled - FTI Studio Browser Port</title>
<style>
:root{--w:#1e1e1e;--p:#252526;--c:#2d2d30;--b:#3f3f46;--t:#dcdcdc;--a:#007acc}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--w);color:var(--t);font:12px "Segoe UI",Tahoma,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#menu{background:var(--p);display:flex;color:#fff;user-select:none}
.mi{padding:6px 10px;position:relative;cursor:default}
.mi.open,.mi:hover{background:var(--a)}
.dd{display:none;position:absolute;left:0;top:100%;background:var(--p);border:1px solid var(--b);min-width:210px;z-index:50;color:#fff}
.open>.dd{display:block}
.dd div{padding:6px 14px;display:flex;justify-content:space-between;gap:24px;white-space:nowrap}
.dd div:hover{background:var(--a)}
.dd .off{opacity:.4;pointer-events:none}
.dd hr{border:0;border-top:1px solid var(--b);margin:3px 0}
#main{flex:1;display:flex;min-height:0}
#tools{width:160px;background:var(--p);padding:10px;overflow:auto}
#tools h6{margin:0 0 4px;font-size:11px}
#tools button.t{display:block;width:100%;height:36px;margin-bottom:4px;background:var(--c);color:var(--t);border:1px solid var(--b);font:inherit}
#tools button.t.on{background:var(--a);color:#fff}
#tools label{display:block;margin:10px 0 4px}
#tools input{width:100%;background:var(--c);color:var(--t);border:1px solid var(--b);padding:3px;font:inherit}
#colorBtn{display:block;width:100%;height:36px;border:1px solid var(--b);background:#fff;color:#000;font:inherit}
#host{flex:1;overflow:auto;background:#000;position:relative}
#wrap{position:relative;width:max-content;height:max-content;outline:1px solid #fff;outline-offset:0;
background:conic-gradient(#3c3c3c 25%,#2d2d2d 0 50%,#3c3c3c 0 75%,#2d2d2d 0) 0 0/24px 24px}
#cv{display:block;touch-action:none}
#sel{position:absolute;z-index:90000;border:1px dashed var(--a);pointer-events:none;display:none}
#sel i{position:absolute;width:6px;height:6px;background:var(--a)}
#ta{position:absolute;z-index:90000;display:none;background:#141414;border:0;outline:1px dashed var(--a);outline-offset:2px;padding:0;margin:0;resize:none;overflow:hidden;white-space:pre;font-family:Arial}
#status{background:var(--p);display:flex;gap:18px;padding:3px 10px}
#status span:first-child{flex:1}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:100}
.dlg{background:var(--w);border:1px solid var(--b);padding:16px;min-width:320px;max-width:90vw;line-height:1.6}
.dlg h3{margin:0 0 10px;font-size:13px}
.dlg pre{font:inherit;margin:0 0 12px;white-space:pre-wrap}
.dlg button,.dlg input{background:var(--c);color:var(--t);border:1px solid var(--b);padding:6px 14px;font:inherit}
.dlg input{width:120px;padding:3px}
/* Windows-style colour dialog */
.cd{transform-origin:center;background:#f0f0f0;color:#000;border:1px solid #888;padding:10px;display:flex;gap:10px;font:12px "Segoe UI",Tahoma,sans-serif;user-select:none}
.cd button{background:#e1e1e1;border:1px solid #adadad;color:#000;height:23px;font:inherit}
.cd button:hover:not(:disabled){background:#e5f1fb;border-color:#0078d7}
.cd button:disabled{color:#838383;background:#ccc;border-color:#bfbfbf}
.cd .l{width:210px;display:flex;flex-direction:column}.cd .r{width:268px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(8,24px);gap:2px 2px;margin:4px 0}
.grid b{width:24px;height:22px;border:1px solid #fff;outline:1px solid #7a7a7a;outline-offset:-2px;border-color:#808080 #fff #fff #808080;display:block}
.grid b.s{outline:1px dotted #000;outline-offset:1px}
.grid.c b:not(.f){background:#fff}
.sp{position:relative;width:268px;height:198px;display:flex;gap:6px;align-items:flex-start}
#sc{cursor:none;border:1px solid #888}
#lc{width:16px;height:198px;border:1px solid #888;cursor:pointer;flex:none}
#ar{position:absolute;left:255px;width:0;height:0;border:7px solid transparent;border-right:9px solid #000;border-left:0;margin-top:-7px}
#cx{position:absolute;width:15px;height:15px;margin:-7px 0 0 -7px;pointer-events:none}
#cx:before,#cx:after{content:"";position:absolute;background:#000}
#cx:before{left:7px;top:0;width:1px;height:15px}#cx:after{top:7px;left:0;height:1px;width:15px}
.cd .in{display:grid;grid-template-columns:auto 42px auto 42px;gap:6px 6px;align-items:center;justify-content:end}
.cd .in input{width:42px;min-width:0;height:22px;border:1px solid #7a7a7a;text-align:right;padding:0 3px;background:#fff;color:#000;font:inherit}
.cd .pv{width:78px;height:62px;border:1px solid #888;margin-top:6px}
.cd .rw{display:flex;gap:8px}.cd .rw button{width:80px}
</style></head><body>
<div id="app">
 <div id="menu"></div>
 <div id="main">
  <div id="tools">
   <h6>TOOLS</h6>
   <button class="t" data-t="pen">Pen</button><button class="t" data-t="eraser">Eraser</button>
   <button class="t" data-t="text">Text</button><button class="t" data-t="select">Select</button>
   <button class="t" data-t="eyedropper">Eyedropper</button>
   <div id="sizeBox"><label>Size</label><input id="size" type="number" min="1" max="200" value="4"></div>
   <div id="colorBox"><label>Color</label><button id="colorBtn">Pick Color...</button></div>
  </div>
  <div id="host"><div id="wrap"><canvas id="cv" width="800" height="600"></canvas><div id="sel"><i style="left:-4px;top:-4px"></i><i style="right:-4px;top:-4px"></i><i style="left:-4px;bottom:-4px"></i><i style="right:-4px;bottom:-4px"></i></div><textarea id="ta" spellcheck="false"></textarea></div></div>
 </div>
 <div id="status"><span id="sFile">Untitled</span><span id="sSize"></span><span id="sPos">Position: -, -</span></div>
</div>
<input type="file" id="file" accept=".fti,.png" hidden>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),ta=$('#ta'),selEl=$('#sel');
let tool='pen',color='#ffffff',size=4,drawing=false,last,sel=null,selecting=false,s0,undoS=[],redoS=[],typing=false,tPt,mouse={x:20,y:20},
    name='',fh=null,isFti=false,customCols=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- menu ---------- */
const MENUS={File:[['Open...',openDlg],['-'],['Canvas Size...',sizeDlg],['-'],['Save',()=>saveFti(false),'','save'],['Save As...',()=>saveFti(true)]],
 Edit:[['Undo',undo,'Ctrl+Z','undo'],['Redo',redo,'Ctrl+Y','redo'],['-'],['Copy',copySel,'Ctrl+C'],['Paste',menuPaste,'Ctrl+V'],['-'],['Select All',selectAll,'Ctrl+A'],['Delete Selection',delSel,'Delete']],
 Help:[['What is .FTI?',()=>info('What is .FTI?','FTI stands for Flat Transparency Image.\n\nFlat  - a plain 2D image format, no layers or vector data.\nTransparency  - stores a full alpha channel, so parts of the image can be see-through.\nImage  - an image format, holding pixel data.\n\nLike JFIF, an .FTI file is small and simple, but unlike JFIF it keeps a real transparent background instead of a solid one.')],
  ['Shortcuts',()=>info('Shortcuts','Ctrl + Z    Undo\nCtrl + Y    Redo\nCtrl + C    Copy (selection or whole image)\nCtrl + V    Paste (text -> Text tool; image -> pastes)\nCtrl + A    Select All (image)\nDelete / Backspace   Delete Selection\n\nWhile typing text in the Text tool:\nCtrl + C / V / A   Copy / Paste / Select all text\nEsc or Enter       Commit text\nShift+Enter        Insert line break\nClick away         Commit text')]]};
const items={};
(function(){const m=$('#menu');for(const k in MENUS){const d=document.createElement('div');d.className='mi';d.innerHTML=k+'<div class="dd"></div>';const dd=d.lastChild;
 MENUS[k].forEach(([l,f,sc,id])=>{if(l=='-'){dd.append(document.createElement('hr'));return}const r=document.createElement('div');r.innerHTML=`<span>${l}</span><span>${sc||''}</span>`;
  r.onclick=e=>{e.stopPropagation();m.querySelectorAll('.open').forEach(x=>x.classList.remove('open'));f()};if(id)items[id]=r;dd.append(r)});
 d.onclick=e=>{const o=d.classList.contains('open');m.querySelectorAll('.open').forEach(x=>x.classList.remove('open'));if(!o)d.classList.add('open')};m.append(d)}
 document.addEventListener('click',e=>{if(!e.target.closest('.mi'))m.querySelectorAll('.open').forEach(x=>x.classList.remove('open'))});
 items.save.style.display='none';menuState()})();
function menuState(){items.undo.classList.toggle('off',!undoS.length);items.redo.classList.toggle('off',!redoS.length)}

/* ---------- tools ---------- */
function selectTool(t){if(typing&&t!='text')commitText();if(tool=='select'&&t!='select')clearSel();tool=t;uiTools()}
function uiTools(){document.querySelectorAll('button.t').forEach(b=>b.classList.toggle('on',b.dataset.t==tool));
 $('#sizeBox').style.display=['pen','eraser','text'].includes(tool)?'':'none';
 $('#colorBox').style.display=['pen','text','eyedropper'].includes(tool)?'':'none'}
document.querySelectorAll('button.t').forEach(b=>b.onclick=()=>selectTool(b.dataset.t));
$('#size').onkeydown=e=>{if(e.key=='Enter'&&parseInt(e.target.value)>200){e.target.value=200;e.target.oninput(e)}};
$('#size').oninput=e=>{size=clamp(parseInt(e.target.value)||1,1,200);if(typing){ta.style.fontSize=size+'px';ta.style.lineHeight=size*1.15+'px';fitTa()}};
$('#colorBtn').onclick=()=>colorDialog(color,c=>{setColor(c);if(typing)ta.style.color=c});
function setColor(c){color=c;$('#colorBtn').style.background=c;const n=parseInt(c.slice(1),16);$('#colorBtn').style.color=((n>>16&255)*.3+(n>>8&255)*.59+(n&255)*.11)>140?'#000':'#fff'}

/* ---------- undo / redo ---------- */
const snap=()=>ctx.getImageData(0,0,cv.width,cv.height);
function restore(d){cv.width=d.width;cv.height=d.height;ctx.putImageData(d,0,0);status()}
function pushUndo(){undoS.push(snap());if(undoS.length>40)undoS.shift();redoS=[];menuState()}
function undo(){if(typing)commitText();if(!undoS.length)return;redoS.push(snap());restore(undoS.pop());menuState()}
function redo(){if(typing)commitText();if(!redoS.length)return;undoS.push(snap());restore(redoS.pop());menuState()}

/* ---------- canvas input ---------- */
const pos=e=>{const r=cv.getBoundingClientRect();return{x:Math.round(e.clientX-r.left),y:Math.round(e.clientY-r.top)}};
function stroke(a,b){ctx.save();const er=tool=='eraser';ctx.globalCompositeOperation=er?'destination-out':'source-over';
 ctx.strokeStyle=ctx.fillStyle=er?'#000':color;ctx.lineWidth=size;ctx.lineCap='round';
 if(a.x==b.x&&a.y==b.y){ctx.beginPath();ctx.arc(a.x,a.y,size/2,0,7);ctx.fill()}else{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.restore()}
cv.onpointerdown=e=>{if(e.button!==0)return;const p=pos(e);mouse=p;
 if(tool=='eyedropper'){const d=ctx.getImageData(clamp(p.x,0,cv.width-1),clamp(p.y,0,cv.height-1),1,1).data;
  if(!d[3]){$('#sPos').textContent=`Position: ${p.x}, ${p.y} (transparent)`;return}
  setColor('#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));selectTool('pen');return}
 if(tool=='text'){if(typing)commitText();beginText(p);e.preventDefault();return}
 cv.setPointerCapture(e.pointerId);
 if(tool=='select'){if(sel&&!inRect(p,sel))clearSel();selecting=true;s0=p;sel={x:p.x,y:p.y,w:0,h:0};drawSel();hasSel=false}
 else{pushUndo();drawing=true;last=p;stroke(p,p)}};
let hasSel=false;
const inRect=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
cv.onpointermove=e=>{const p=pos(e);mouse=p;const px=clamp(p.x,0,cv.width-1),py=clamp(p.y,0,cv.height-1);
 if(tool=='eyedropper'){const d=ctx.getImageData(px,py,1,1).data;$('#sPos').textContent=`Position: ${p.x}, ${p.y}  RGB(${d[0]},${d[1]},${d[2]}) A:${d[3]}`}else $('#sPos').textContent=`Position: ${p.x}, ${p.y}`;
 if(selecting){const c={x:clamp(p.x,0,cv.width),y:clamp(p.y,0,cv.height)};sel={x:Math.min(s0.x,c.x),y:Math.min(s0.y,c.y),w:Math.abs(c.x-s0.x),h:Math.abs(c.y-s0.y)};drawSel()}
 else if(drawing){stroke(last,p);last=p}};
cv.onpointerup=()=>{if(selecting){selecting=false;if(sel.w>0&&sel.h>0)hasSel=true;else clearSel()}drawing=false};
cv.onpointerleave=()=>{if(!drawing&&!selecting)$('#sPos').textContent='Position: -, -'};
function drawSel(){if(!sel){selEl.style.display='none';return}Object.assign(selEl.style,{display:'block',left:sel.x+'px',top:sel.y+'px',width:sel.w+'px',height:sel.h+'px'})}
function clearSel(){sel=null;hasSel=false;selecting=false;drawSel()}
function selectAll(){if(typing)commitText();tool='select';uiTools();sel={x:0,y:0,w:cv.width,h:cv.height};hasSel=true;drawSel()}
function delSel(){if(tool!='select'||!hasSel||!sel.w||!sel.h)return;pushUndo();ctx.clearRect(sel.x,sel.y,sel.w,sel.h);clearSel()}

/* ---------- text ---------- */
function fitTa(){const lines=(ta.value||' ').split('\n');ctx.save();ctx.font=size+'px Arial';const w=Math.max(...lines.map(l=>ctx.measureText(l).width));ctx.restore();
 const W=Math.max(80,Math.ceil(w)+12),H=Math.max(20,Math.ceil(lines.length*size*1.15)+4);ta.style.width=W+'px';ta.style.height=H+'px';
 ta.style.clipPath=`inset(-4px ${Math.max(0,W-(cv.width-tPt.x))}px ${Math.max(0,H-(cv.height-tPt.y))}px -4px)`}
function beginText(p,init=''){typing=true;tPt=p;Object.assign(ta.style,{display:'block',left:p.x+'px',top:p.y+'px',color:color,fontSize:size+'px',lineHeight:size*1.15+'px'});
 ta.value=init;fitTa();ta.focus();if(init)ta.select()}
ta.oninput=fitTa;
ta.onkeydown=e=>{e.stopPropagation();if(e.key=='Escape'||(e.key=='Enter'&&!e.shiftKey)){e.preventDefault();commitText()}};
function commitText(){if(!typing)return;typing=false;const v=ta.value;ta.style.display='none';ta.value='';
 if(v){pushUndo();ctx.save();ctx.font=size+'px Arial';ctx.textBaseline='top';ctx.fillStyle=color;v.split('\n').forEach((l,i)=>ctx.fillText(l,tPt.x,tPt.y+i*size*1.15));ctx.restore()}}

/* ---------- clipboard ---------- */
function cropCanvas(){const r=tool=='select'&&hasSel?sel:{x:0,y:0,w:cv.width,h:cv.height};if(r.w<=0||r.h<=0)return null;
 const c=document.createElement('canvas');c.width=r.w;c.height=r.h;c.getContext('2d').drawImage(cv,r.x,r.y,r.w,r.h,0,0,r.w,r.h);return c}
function copySel(){const c=cropCanvas();if(!c)return;try{c.toBlob(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})]).catch(()=>{}))}catch(e){}}
async function pasteImage(blob){const bmp=await createImageBitmap(blob),t=document.createElement('canvas');t.width=bmp.width;t.height=bmp.height;
 const x=t.getContext('2d');x.drawImage(bmp,0,0);const d=x.getImageData(0,0,t.width,t.height);for(let i=3;i<d.data.length;i+=4)d.data[i]=255;x.putImageData(d,0,0);
 pushUndo();if(tool=='select'&&hasSel&&sel.w>0&&sel.h>0)ctx.drawImage(t,sel.x,sel.y,sel.w,sel.h);else ctx.drawImage(t,0,0)}
function pasteText(s){if(typing)commitText();tool='text';uiTools();beginText({x:clamp(mouse.x,0,cv.width-1),y:clamp(mouse.y,0,cv.height-1)},s)}
document.addEventListener('paste',e=>{if(e.target===ta||e.target.tagName=='INPUT')return;e.preventDefault();const cd=e.clipboardData,t=cd.getData('text');
 if(t){pasteText(t);return}for(const it of cd.items)if(it.type.startsWith('image/')){pasteImage(it.getAsFile());return}});
async function menuPaste(){try{for(const it of await navigator.clipboard.read()){if(it.types.includes('text/plain')){pasteText(await(await it.getType('text/plain')).text());return}
 const t=it.types.find(x=>x.startsWith('image/'));if(t){pasteImage(await it.getType(t));return}}}catch(e){info('Paste','Your browser blocked clipboard access. Press Ctrl+V instead.')}}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'||e.target===ta)return;const k=e.key.toLowerCase();
 if(e.ctrlKey&&k=='z'){e.preventDefault();undo()}else if(e.ctrlKey&&k=='y'){e.preventDefault();redo()}
 else if(e.ctrlKey&&k=='c'){e.preventDefault();copySel()}else if(e.ctrlKey&&k=='a'){e.preventDefault();selectAll()}
 else if((e.key=='Delete'||e.key=='Backspace')&&tool=='select'&&hasSel){e.preventDefault();delSel()}});

/* ---------- files ---------- */
async function pipe(u8,S){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new S('deflate-raw'))).arrayBuffer())}
async function ftiBlob(){const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data,b=new Uint8Array(d.length);
 for(let i=0;i<d.length;i+=4){b[i]=d[i+2];b[i+1]=d[i+1];b[i+2]=d[i];b[i+3]=d[i+3]}
 const z=await pipe(b,CompressionStream),o=new Uint8Array(16+z.length),dv=new DataView(o.buffer);
 o.set([70,84,73,49]);dv.setInt32(4,w,true);dv.setInt32(8,h,true);dv.setInt32(12,z.length,true);o.set(z,16);return new Blob([o])}
async function loadFti(buf){const u=new Uint8Array(buf),dv=new DataView(buf);
 if(u.length<16||u[0]!=70||u[1]!=84||u[2]!=73||u[3]!=49)throw new Error('This file is not a valid .FTI (Flat Transparency Image) file.');
 const w=dv.getInt32(4,true),h=dv.getInt32(8,true),n=dv.getInt32(12,true),raw=await pipe(u.slice(16,16+n),DecompressionStream);
 const d=new Uint8ClampedArray(w*h*4);for(let i=0;i<d.length&&i<raw.length;i+=4){d[i]=raw[i+2];d[i+1]=raw[i+1];d[i+2]=raw[i];d[i+3]=raw[i+3]}
 cv.width=w;cv.height=h;ctx.putImageData(new ImageData(d,w,h),0,0)}
function reset(label,fti){if(typing)commitText();clearSel();undoS=[];redoS=[];menuState();isFti=fti;items.save.style.display=fti?'':'none';setTitle(label)}
function setTitle(l){document.title=l+' - FTI Studio Browser Port';$('#sFile').textContent=l;status()}
function status(){$('#sSize').textContent=cv.width+' x '+cv.height+' px'}
function openDlg(){$('#file').click()}
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)};
async function openFile(f){try{const ext=f.name.split('.').pop().toLowerCase(),base=f.name.replace(/\.[^.]+$/,'');
 if(ext=='fti'){await loadFti(await f.arrayBuffer());fh=null;name=base;reset(base,true)}
 else if(ext=='png'){const b=await createImageBitmap(f);cv.width=b.width;cv.height=b.height;ctx.drawImage(b,0,0);fh=null;name='';reset(base+' (converted from PNG, unsaved)',false)}
 else throw new Error('Unsupported file type.')}catch(err){info('Open','Could not open that file:\n'+err.message)}}
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])openFile(e.dataTransfer.files[0])});
async function saveFti(as){try{const b=await ftiBlob();
 if(window.showSaveFilePicker){if(as||!fh)fh=await showSaveFilePicker({suggestedName:(name||'untitled')+'.fti',types:[{description:'FTI Image',accept:{'application/octet-stream':['.fti']}}]});
  const w=await fh.createWritable();await w.write(b);await w.close();name=fh.name.replace(/\.fti$/i,'')}
 else{const n=(as||!name)?prompt('File name:',name||'untitled'):name;if(!n)return;name=n.replace(/\.fti$/i,'');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.fti';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
 isFti=true;items.save.style.display='';setTitle(name)}catch(e){if(e.name!='AbortError')info('Save','Could not save:\n'+e.message)}}

/* ---------- canvas size ---------- */
function sizeDlg(){const o=modal(`<h3>Canvas Size</h3><div>Width (px)&nbsp; <input id="cw" type="number" min="1" value="${cv.width}"></div><div style="margin:6px 0 8px">Height (px) <input id="ch" type="number" min="1" value="${cv.height}"></div><div id="er" style="color:#f44;margin-bottom:8px;min-height:1.6em"></div><button id="ok">Apply</button> <button id="cn">Cancel</button>`);
 o.querySelector('#cn').onclick=()=>o.remove();
 o.querySelector('#ok').onclick=()=>{let w=parseInt(o.querySelector('#cw').value),h=parseInt(o.querySelector('#ch').value);
  if(!(w>0&&h>0))return;if(w>8000||h>8000){o.querySelector('#er').textContent='Maximum dimension is 8000 pixels';return}o.remove();
  if(typing)commitText();pushUndo();const old=snap(),t=document.createElement('canvas');t.width=old.width;t.height=old.height;t.getContext('2d').putImageData(old,0,0);
  cv.width=w;cv.height=h;ctx.drawImage(t,0,0);clearSel();status()}}

/* ---------- dialogs ---------- */
function modal(html,raw){const o=document.createElement('div');o.className='ov';o.innerHTML=raw?html:`<div class="dlg">${html}</div>`;document.body.append(o);
 const k=e=>{if(e.key=='Escape'){o.remove();removeEventListener('keydown',k)}};addEventListener('keydown',k);return o}
function info(t,s){const o=modal(`<h3>${t}</h3><pre></pre><button>Close</button>`);o.querySelector('pre').textContent=s;o.querySelector('button').onclick=()=>o.remove()}
